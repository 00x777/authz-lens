name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Dogfood: the vulnerable fixture must keep producing findings.
      - run: authz-lens tests/fixtures/vuln_app.py --fail-on medium && exit 1 || echo "findings reported as expected"
